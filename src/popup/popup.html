<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetCode GitHub Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
        </svg>
        <span class="brand-title">LeetCode Sync</span>
      </div>
      <button id="open-settings-icon" class="icon-button" title="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Connected State View -->
    <div id="connected-view" class="view-panel" style="display: none;">
      <div class="status-card">
        <div class="status-row">
          <span class="label">GitHub</span>
          <span class="status-badge connected">
            <span class="status-dot"></span> Connected
          </span>
        </div>
        <div class="status-row">
          <span class="label">Repository</span>
          <span id="repo-display" class="value-highlight">-</span>
        </div>
        <div class="status-row">
          <span class="label">Branch</span>
          <span id="branch-display" class="value-text">-</span>
        </div>
        <div class="status-row">
          <span class="label">Last sync</span>
          <span id="last-sync-display" class="value-text">Never</span>
        </div>
      </div>

      <div class="section-title">Recent Solutions</div>
      <div id="recent-list" class="recent-list">
        <div class="empty-state">No solutions synced yet</div>
      </div>

      <div class="action-footer">
        <button id="open-github-btn" class="btn btn-secondary">Open GitHub ↗</button>
        <button id="open-settings-btn" class="btn btn-secondary">Settings</button>
      </div>
    </div>

    <!-- Disconnected State View -->
    <div id="disconnected-view" class="view-panel" style="display: none;">
      <div class="disconnected-hero">
        <div class="alert-icon">!</div>
        <h3>GitHub Not Connected</h3>
        <p>Connect your GitHub account and repository to start automatically syncing your LeetCode solutions.</p>
        <button id="connect-btn" class="btn btn-primary btn-large">Connect GitHub</button>
      </div>
    </div>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
