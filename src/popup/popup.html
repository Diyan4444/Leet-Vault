<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leet-Vault</title>
  <link rel="icon" type="image/png" href="/icons/icon-32.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <img src="/icons/icon-32.png" width="20" height="20" alt="Leet-Vault" style="border-radius: 4px;">
        <span class="brand-title">Leet-Vault</span>
      </div>
      <button id="open-settings-icon" class="icon-button" title="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Connected State View -->
    <div id="connected-view" class="view-panel" style="display: none;">
      <div class="status-card">
        <div class="status-row">
          <span class="label">GitHub</span>
          <span class="status-badge connected">
            <span class="status-dot"></span> <span id="github-user-badge">Connected</span>
          </span>
        </div>
        <div class="status-row">
          <span class="label">Repository</span>
          <span id="repo-display" class="value-highlight">-</span>
        </div>
        <div id="repo-verified-row" class="status-row" style="display: none;">
          <span class="label">Access</span>
          <span class="status-badge connected" style="font-size: 11px;">
            ✓ Verified (Push access confirmed)
          </span>
        </div>
        <div class="status-row">
          <span class="label">Branch</span>
          <span id="branch-display" class="value-text">-</span>
        </div>
        <div class="status-row">
          <span class="label">Last sync</span>
          <span id="last-sync-display" class="value-text">Never</span>
        </div>
      </div>

      <!-- Pending Syncs Section -->
      <div id="pending-section" style="display: none; margin-top: 14px;">
        <div class="section-title" style="color: #d97706; display: flex; justify-content: space-between; align-items: center;">
          <span>Pending Sync Queue</span>
          <span id="pending-count-badge" style="background: #fef3c7; color: #92400e; padding: 1px 6px; border-radius: 10px; font-size: 11px; font-weight: 700;">0</span>
        </div>
        <div id="pending-list" class="recent-list" style="margin-top: 6px;"></div>
      </div>

      <div class="section-title" style="margin-top: 14px;">Recent Solutions</div>
      <div id="recent-list" class="recent-list">
        <div class="empty-state">No solutions synced yet</div>
      </div>

      <div class="action-footer">
        <button id="open-github-btn" class="btn btn-secondary">Open Repository ↗</button>
        <button id="change-repo-btn" class="btn btn-secondary">Change Repository</button>
        <button id="disconnect-popup-btn" class="btn btn-secondary" style="color: #dc2626;">Disconnect</button>
      </div>
    </div>

    <!-- Disconnected State View -->
    <div id="disconnected-view" class="view-panel" style="display: none;">
      <div class="disconnected-hero">
        <div class="alert-icon">!</div>
        <h3>GitHub Not Connected</h3>
        <p>Authorize with GitHub to start automatically syncing your accepted LeetCode solutions.</p>
        <button id="connect-btn" class="btn btn-primary btn-large">Connect GitHub</button>
        <div id="auth-error-hint" style="color: #dc2626; font-size: 12px; margin-top: 10px; display: none;"></div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
